<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->
		<meta name="theme-color" content="#f2ebe3" />

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="./style.css" />

		<title>Frontend Mentor | Product preview card component</title>
	</head>
	<body>
		<main class="page">
			<article class="card">
				<picture class="card__media">
					<source
						media="(min-width: 37.5rem)"
						srcset="./images/image-product-desktop.jpg"
						width="600"
						height="900"
					/>
					<img
						class="card__image"
						src="./images/image-product-mobile.jpg"
						width="700"
						height="684"
						fetchpriority="high"
						alt="Gabrielle Essence Eau De Parfum bottle lying on a light surface next to green leaves"
					/>
				</picture>

				<div class="card__content">
					<p class="card__category">Perfume</p>

					<h1 class="card__title" translate="no">Gabrielle Essence Eau De Parfum</h1>

					<p class="card__description">
						A floral, solar and voluptuous interpretation composed by Olivier
						Polge, Perfumer-Creator for the House of CHANEL.
					</p>

					<p class="card__prices">
						<span class="visually-hidden">Current price:</span>
						<strong class="card__price">$149.99</strong>
						<span class="visually-hidden">Original price:</span>
						<del class="card__price-old">$169.99</del>
					</p>

					<button class="card__button" type="button">
						<img src="./images/icon-cart.svg" alt="" width="15" height="16" />
						Add to Cart
					</button>
				</div>
			</article>
		</main>

		<footer class="attribution">
			Challenge by
			<a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
			Coded by
			<a target="_blank" href="https://github.com/delfinjfb">Delfin</a>.
		</footer>
	</body>
</html>
